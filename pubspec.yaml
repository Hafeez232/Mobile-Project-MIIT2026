name: fine_dine
description: Fine-Dine Restaurant Package Booking App

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.0.0

  # Firebase
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  # firebase_storage: not needed - using image URLs instead

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  # Routing
  go_router: ^17.2.3

  # Network / Images
  image_picker: ^1.0.0
  cached_network_image: ^3.4.1
  http: ^1.2.2

  # Caching / Storage
  shared_preferences: ^2.3.3
  # flutter_secure_storage: removed for web compatibility

  # UI
  flutter_svg: ^2.0.10+1
  intl: ^0.20.2
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1
  table_calendar: ^3.1.2

  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
